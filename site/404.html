<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found — Latent Aurum</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2308080A'/%3E%3Cg fill='%23CDAC78'%3E%3Crect x='22' y='38' width='6' height='26'/%3E%3Crect x='35' y='28' width='6' height='46'/%3E%3Crect x='47' y='18' width='6' height='66'/%3E%3Crect x='59' y='30' width='6' height='42'/%3E%3Crect x='72' y='37' width='6' height='28'/%3E%3C/g%3E%3C/svg%3E">
<style>
/* GitHub Pages shows this page for any address that does not exist. Everything it needs is in this file,
   apart from the font, which comes from the site itself (and falls back to the system font). */
@font-face{font-family:"Hubot Sans";src:url("/assets/fonts/hubot-sans.woff2") format("woff2");font-weight:200 900;font-stretch:75% 125%;font-display:swap}
:root{--obsidian:#08080A;--ivory:#EFE9DD;--stone:#A8A091;--gold:#CDAC78;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:grid;place-items:center;padding:24px 16px;background:var(--obsidian);color:var(--ivory);font-family:"Hubot Sans",system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
main{display:grid;justify-items:center;gap:22px;max-width:44rem}
.mark{width:26px;height:40px;fill:var(--gold)}
h1{margin:0;font-size:clamp(2.4rem,9vw,6rem);font-weight:800;font-stretch:125%;line-height:.92;letter-spacing:-.01em;text-transform:uppercase}
p{margin:0;max-width:30ch;font-size:clamp(1.05rem,2vw,1.3rem);line-height:1.4;color:var(--stone)}
a{display:inline-flex;align-items:center;min-height:44px;padding:0 1.2em;border:1px solid var(--ivory);color:var(--ivory);font-size:.72rem;font-weight:600;font-stretch:112%;letter-spacing:.12em;text-decoration:none;text-transform:uppercase;transition:background-color .3s,color .3s}
a:hover,a:focus-visible{background:var(--ivory);color:var(--obsidian);outline:none}
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 66 100" aria-hidden="true"><rect x="0" y="35" width="6" height="33"/><rect x="15" y="21.75" width="6" height="58.7"/><rect x="30" y="0" width="6" height="100"/><rect x="45" y="17.5" width="6" height="65"/><rect x="60" y="27.05" width="6" height="43.3"/></svg>
  <h1>Page not found</h1>
  <p>The page you asked for isn't here. It may have moved.</p>
  <a href="/">Go to the home page</a>
</main>
</body>
</html>
