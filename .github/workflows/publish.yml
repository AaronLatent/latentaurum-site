# Publishes the site folder to GitHub Pages every time you push to main.
# The check runs first: if it finds a problem, nothing is published and the site stays as it was.
# Two jobs, as GitHub recommends: "package" checks and packages the site, then "publish" puts that package online.
# Keeping them apart gives GitHub time to list the package before the publish looks for it.
name: Publish the site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.name.outputs.artifact }}
    steps:
      - name: Get the files
        uses: actions/checkout@v6

      - name: Check the site
        run: bash tools/check-site.sh

      - name: Set up Pages
        uses: actions/configure-pages@v6

      # Each try packages under its own name, so "Re-run all jobs" can never find two packages with the same name.
      - name: Name the package
        id: name
        run: echo "artifact=github-pages-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Package the site folder
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          name: ${{ steps.name.outputs.artifact }}

  publish:
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Give GitHub a moment to list the package
        run: sleep 15

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.package.outputs.artifact }}
